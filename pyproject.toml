[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "digital-twin"
version = "0.1.0"
description = "AI Digital Twin for a Smart Classroom: personalized learning, classroom analytics, and academic decision support."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "anthropic>=0.40",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=2.1",
    "faker>=30.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/digital_twin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
strict = true
ignore_missing_imports = true
